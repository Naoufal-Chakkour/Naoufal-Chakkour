height="2"
fill="url(#scan)"
opacity="0.8">

<animate
attributeName="y"
values="80;350;80"
dur="5s"
repeatCount="indefinite"/>

</rect>

<!-- STATUS -->

<circle cx="420"
cy="390"
r="6"
fill="#58a6ff"
filter="url(#glow)">

<animate
attributeName="r"
values="6;11;6"
