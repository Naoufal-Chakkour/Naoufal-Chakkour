<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
<stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1000" height="430" fill="#0d1117"/>

<!-- GRID -->

<g stroke="#58a6ff" stroke-width="1" opacity="0.06">

<path d="M0 80H1000"/>
<path d="M0 160H1000"/>
<path d="M0 240H1000"/>
<path d="M0 320H1000"/>
<path d="M0 400H1000"/>

<path d="M100 0V430"/>
<path d="M200 0V430"/>
<path d="M300 0V430"/>
<path d="M400 0V430"/>
<path d="M500 0V430"/>
<path d="M600 0V430"/>
<path d="M700 0V430"/>
<path d="M800 0V430"/>
<path d="M900 0V430"/>

</g>

<!-- TITLE -->

<text x="500" y="42"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="20"
font-weight="bold">

GITHUB ANALYTICS

</text>

