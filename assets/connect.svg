<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
<stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1000" height="360" fill="#0d1117"/>

<!-- GRID -->

<g stroke="#58a6ff" stroke-width="1" opacity="0.06">

<path d="M0 80H1000"/>
<path d="M0 160H1000"/>
<path d="M0 240H1000"/>
<path d="M0 320H1000"/>

<path d="M100 0V360"/>
<path d="M200 0V360"/>
<path d="M300 0V360"/>
<path d="M400 0V360"/>
<path d="M500 0V360"/>
<path d="M600 0V360"/>
<path d="M700 0V360"/>
<path d="M800 0V360"/>
<path d="M900 0V360"/>

</g>

<!-- TITLE -->

<text x="500" y="42"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="20"
font-weight="bold">

CONNECT

</text>

<!-- GITHUB -->

<rect x="90" y="85"
width="240" height="90"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<text x="210" y="120"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="12">

PLATFORM

</text>

<text x="210" y="150"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="18"
font-weight="bold">

GITHUB

</text>

<!-- SECURITY -->

<rect x="380" y="85"
width="240" height="90"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<text x="500" y="120"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="12">

FOCUS

</text>

<text x="500" y="150"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="18"
font-weight="bold">

CYBERSECURITY

</text>

<!-- DEVELOPMENT -->

<rect x="670" y="85"
width="240" height="90"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<text x="790" y="120"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="12">

BUILD

</text>

<text x="790" y="150"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="18"
font-weight="bold">

DEVELOPMENT

</text>

<!-- DIVIDER -->

<line x1="120"
y1="215"
x2="880"
y2="215"
stroke="#58a6ff"
stroke-width="1"
opacity="0.3"/>

<!-- STATUS -->

<circle cx="350"
cy="265"
r="6"
fill="#58a6ff"
filter="url(#glow)">

<animate
attributeName="r"
values="6;12;6"
dur="1.5s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="1;0.2;1"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<text x="375"
y="270"
fill="#8b949e"
font-family="monospace"
font-size="12">

SYSTEM STATUS : ONLINE

</text>

<text x="500"
y="305"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="13"
font-weight="bold">

BUILD • LEARN • ANALYZE

</text>

<!-- SCANNER -->

<rect x="90"
y="85"
width="820"
height="2"
fill="url(#scan)"
opacity="0.8">

<animate
attributeName="y"
values="85;175;85"
dur="4s"
repeatCount="indefinite"/>

</rect>

</svg>
