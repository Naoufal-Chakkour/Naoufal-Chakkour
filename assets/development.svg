<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
<stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1000" height="430" fill="#0d1117"/>

<!-- GRID -->

<g stroke="#58a6ff" stroke-width="1" opacity="0.06">

<path d="M0 80H1000"/>
<path d="M0 160H1000"/>
<path d="M0 240H1000"/>
<path d="M0 320H1000"/>
<path d="M0 400H1000"/>

<path d="M100 0V430"/>
<path d="M200 0V430"/>
<path d="M300 0V430"/>
<path d="M400 0V430"/>
<path d="M500 0V430"/>
<path d="M600 0V430"/>
<path d="M700 0V430"/>
<path d="M800 0V430"/>
<path d="M900 0V430"/>

</g>

<!-- TITLE -->

<text x="500" y="42"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="20"
font-weight="bold">

DEVELOPMENT PIPELINE

</text>

<!-- CONNECTIONS -->

<g stroke="#58a6ff"
stroke-width="2"
fill="none"
opacity="0.4">

<path d="M250 180H350"/>
<path d="M500 180H600"/>
<path d="M750 180V270"/>
<path d="M750 270H500"/>
<path d="M500 270H250"/>
<path d="M250 270V350"/>

</g>

<!-- C# -->

<rect x="100" y="120"
width="250" height="120"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"
filter="url(#glow)"/>

<text x="225" y="155"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="13">

LANGUAGE

</text>

<text x="225" y="190"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="22"
font-weight="bold">

C#

</text>

<text x="225" y="215"
text-anchor="middle"
fill="#8b949e"
font-family="monospace"
font-size="11">

OBJECT-ORIENTED PROGRAMMING

</text>

<!-- .NET -->

<rect x="375" y="120"
width="250" height="120"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<text x="500" y="155"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="13">

FRAMEWORK

</text>

<text x="500" y="190"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="22"
font-weight="bold">

.NET

</text>

<text x="500" y="215"
text-anchor="middle"
fill="#8b949e"
font-family="monospace"
font-size="11">

APPLICATION DEVELOPMENT

</text>

<!-- GIT -->

<rect x="650" y="120"
width="250" height="120"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<text x="775" y="155"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="13">

VERSION CONTROL

</text>

<text x="775" y="190"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="22"
font-weight="bold">

GIT

</text>

<text x="775" y="215"
text-anchor="middle"
fill="#8b949e"
font-family="monospace"
font-size="11">

SOURCE CONTROL

</text>

<!-- GITHUB -->

<rect x="375" y="270"
width="250" height="100"
rx="8"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<text x="500" y="305"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="13">

PLATFORM

</text>

<text x="500" y="340"
text-anchor="middle"
fill="#ffffff"
font-family="monospace"
font-size="21"
font-weight="bold">

GITHUB

</text>

<!-- MOVING SIGNAL -->

<circle r="5"
fill="#58a6ff"
filter="url(#glow)">

<animateMotion
dur="4s"
repeatCount="indefinite"
path="M250 180H350H500H600H750V270H500"/>

</circle>

<!-- STATUS -->

<circle cx="390"
cy="400"
r="5"
fill="#58a6ff"
filter="url(#glow)">

<animate
attributeName="r"
values="5;10;5"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<text x="410"
y="405"
fill="#8b949e"
font-family="monospace"
font-size="11">

DEVELOPMENT PIPELINE: ACTIVE

</text>

<!-- SCANNER -->

<rect x="100"
y="120"
width="800"
height="2"
fill="url(#scan)"
opacity="0.8">

<animate
attributeName="y"
values="120;370;120"
dur="5s"
repeatCount="indefinite"/>

</rect>

</svg>
