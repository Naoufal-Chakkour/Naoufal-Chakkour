<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
<stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1000" height="430" fill="#0d1117"/>

<!-- GRID -->

