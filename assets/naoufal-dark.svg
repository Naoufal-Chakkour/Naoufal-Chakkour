<svg
  width="1000"
  height="300"
  viewBox="0 0 1000 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070b0f"/>
    </linearGradient>

    <!-- Glow -->
    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Strong glow -->
    <filter
      id="strongGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur
        stdDeviation="6"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- ECG clip -->
    <clipPath id="ecgClip">
      <rect
        x="60"
        y="132"
        width="880"
        height="32"/>
    </clipPath>

  </defs>


  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="1000"
    height="300"
    rx="16"
    fill="url(#bg)"/>


  <!-- ========================= -->
  <!-- MAIN PANEL -->
  <!-- ========================= -->

  <rect
    x="25"
    y="25"
    width="950"
    height="250"
    rx="12"
    fill="#161b22"
    stroke="#00ff66"
    stroke-width="2"
    opacity="0.98"/>


  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <text
    x="60"
    y="72"
    font-family="monospace"
    font-size="24"
    font-weight="bold"
    fill="#00ff66">

    NAOUFAL CHAKKOUR

  </text>


  <text
    x="60"
    y="101"
    font-family="monospace"
    font-size="13"
    fill="#8b949e">

    GITHUB ACTIVITY MONITOR

  </text>


  <!-- ========================= -->
  <!-- ECG MONITOR LINE -->
  <!-- ========================= -->

  <line
    x1="60"
    y1="130"
    x2="940"
    y2="130"
    stroke="#00ff66"
    opacity="0.18"/>


  <!-- ECG glow -->
