<svg
  width="1000"
  height="340"
  viewBox="0 0 1000 340"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f6f8"/>
    </linearGradient>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur stdDeviation="3" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter
      id="smallGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur stdDeviation="2" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <clipPath id="ecgClip">
      <rect
        x="60"
        y="265"
        width="880"
        height="45"/>
    </clipPath>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1000"
    height="340"
    rx="16"
    fill="url(#bg)"/>


  <!-- MAIN PANEL -->

  <rect
    x="25"
    y="25"
    width="950"
    height="290"
    rx="12"
    fill="#ffffff"
    stroke="#008f4c"
    stroke-width="2"/>


  <!-- HEADER -->

  <text
    x="60"
    y="70"
    font-family="monospace"
    font-size="24"
    font-weight="bold"
    fill="#008f4c">

    NAOUFAL CHAKKOUR

  </text>

  <text
    x="60"
    y="98"
    font-family="monospace"
    font-size="13"
    fill="#57606a">

    GITHUB ACTIVITY MONITOR

  </text>


  <!-- ONLINE -->

  <circle
    cx="900"
    cy="65"
    r="6"
    fill="#008f4c"
    filter="url(#smallGlow)">

    <animate
      attributeName="r"
      values="5;8;5"
      dur="1.8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="1.8s"
      repeatCount="indefinite"/>

  </circle>

  <text
    x="915"
    y="69"
    font-family="monospace"
    font-size="9"
    fill="#008f4c">

    ONLINE

  </text>


  <!-- SEPARATOR -->

  <line
    x1="60"
    y1="120"
    x2="940"
    y2="120"
    stroke="#008f4c"
    opacity="0.30"/>


  <!-- REPOSITORIES -->

  <text
    x="90"
    y="165"
    font-family="monospace"
    font-size="12"
    fill="#57606a">

    PUBLIC REPOSITORIES

  </text>

  <text
    x="90"
    y="205"
    font-family="monospace"
    font-size="30"
    font-weight="bold"
    fill="#008f4c"
    filter="url(#glow)"
    data-stat="PUBLIC_REPOS">

    0

  </text>


  <!-- FOLLOWERS -->

  <text
    x="360"
    y="165"
    font-family="monospace"
    font-size="12"
    fill="#57606a">

    FOLLOWERS

  </text>

  <text
    x="360"
    y="205"
    font-family="monospace"
    font-size="30"
    font-weight="bold"
    fill="#008f4c"
    filter="url(#glow)"
    data-stat="FOLLOWERS">

    0

  </text>


  <!-- FOLLOWING -->

  <text
    x="630"
    y="165"
    font-family="monospace"
    font-size="12"
    fill="#57606a">

    FOLLOWING

  </text>

  <text
    x="630"
    y="205"
    font-family="monospace"
    font-size="30"
    font-weight="bold"
    fill="#008f4c"
    filter="url(#glow)"
    data-stat="FOLLOWING">

    0

  </text>


  <!-- ECG GRID -->

  <line
    x1="60"
    y1="245"
    x2="940"
    y2="245"
    stroke="#008f4c"
    opacity="0.10"/>

  <line
    x1="60"
    y1="285"
    x2="940"
    y2="285"
    stroke="#008f4c"
    opacity="0.10"/>


  <!-- ECG LABEL -->

  <text
    x="60"
    y="238"
    font-family="monospace"
    font-size="8"
    fill="#008f4c">

    LIVE SIGNAL

  </text>


