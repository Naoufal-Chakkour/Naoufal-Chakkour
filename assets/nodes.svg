<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">

<defs>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
  </linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1000" height="620" fill="#0d1117"/>

<!-- GRID -->

<g stroke="#58a6ff" stroke-width="1" opacity="0.07">

<path d="M0 80H1000"/>
<path d="M0 160H1000"/>
<path d="M0 240H1000"/>
<path d="M0 320H1000"/>
<path d="M0 400H1000"/>
<path d="M0 480H1000"/>
<path d="M0 560H1000"/>

<path d="M100 0V620"/>
<path d="M200 0V620"/>
<path d="M300 0V620"/>
<path d="M400 0V620"/>
<path d="M500 0V620"/>
<path d="M600 0V620"/>
<path d="M700 0V620"/>
<path d="M800 0V620"/>
<path d="M900 0V620"/>

</g>

<!-- TITLE -->

<text x="500" y="42"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="18"
font-weight="bold">

TECHNOLOGY NODE SYSTEM

</text>

<!-- CONNECTION LINES -->

<g stroke="#58a6ff"
stroke-width="2"
fill="none"
opacity="0.35">

<path d="M500 190V230"/>

<path d="M500 190L220 250"/>
<path d="M500 190L780 250"/>

<path d="M220 370V390"/>
