<path d="M780 370V390"/>

<path d="M220 490L500 510"/>
<path d="M500 490V510"/>
<path d="M780 490L500 510"/>

</g>

<!-- MOVING SIGNAL -->

<circle r="5" fill="#58a6ff" filter="url(#glow)">

<animateMotion
dur="3s"
repeatCount="indefinite"
path="M500 190L220 250L220 370L500 510"/>

</circle>

<circle r="5" fill="#58a6ff" filter="url(#glow)">

<animateMotion
dur="3.5s"
repeatCount="indefinite"
path="M500 190L780 250L780 370L500 510"/>

