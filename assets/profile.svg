<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
  <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1000" height="430" fill="#0d1117"/>

<!-- GRID -->

<g stroke="#58a6ff" stroke-width="1" opacity="0.06">

<path d="M0 80H1000"/>
<path d="M0 160H1000"/>
<path d="M0 240H1000"/>
<path d="M0 320H1000"/>
<path d="M0 400H1000"/>

<path d="M100 0V430"/>
<path d="M200 0V430"/>
<path d="M300 0V430"/>
<path d="M400 0V430"/>
<path d="M500 0V430"/>
<path d="M600 0V430"/>
<path d="M700 0V430"/>
<path d="M800 0V430"/>
<path d="M900 0V430"/>

</g>

<!-- HEADER -->

<text x="500" y="45"
text-anchor="middle"
fill="#58a6ff"
font-family="monospace"
font-size="20"
font-weight="bold">

SYSTEM PROFILE

</text>

<text x="500" y="72"
text-anchor="middle"
fill="#8b949e"
font-family="monospace"
font-size="11">

NAOUFAL SECURITY &amp; DEVELOPMENT ENVIRONMENT

</text>

<!-- PROFILE BOX -->

<rect x="70" y="100"
width="860" height="250"
rx="10"
fill="#161b22"
stroke="#58a6ff"
stroke-width="2"/>

<!-- NAME -->

<text x="105" y="135"
fill="#58a6ff"
font-family="monospace"
font-size="13">

IDENTITY

</text>

<text x="105" y="170"
fill="#ffffff"
font-family="monospace"
font-size="23"
font-weight="bold">

NAOUFAL CHAKKOUR

</text>

<text x="105" y="198"
fill="#8b949e"
font-family="monospace"
font-size="12">

CYBERSECURITY • NETWORKING • DEVELOPMENT

</text>

<!-- DIVIDER -->

<line x1="105"
y1="220"
x2="895"
y2="220"
stroke="#58a6ff"
stroke-width="1"
opacity="0.25"/>

<!-- SKILL LABELS -->

<text x="105" y="250"
fill="#8b949e"
font-family="monospace"
font-size="12">

NETWORK SECURITY

</text>

<text x="105" y="282"
fill="#8b949e"
font-family="monospace"
font-size="12">

LINUX / KALI

</text>

<text x="105" y="314"
fill="#8b949e"
font-family="monospace"
font-size="12">

C# / .NET

</text>

<text x="105" y="346"
fill="#8b949e"
font-family="monospace"
font-size="12">

IoT / ONVIF

</text>

<!-- BARS -->

<g fill="#58a6ff">

<rect x="300" y="240" width="420" height="10" rx="3"/>

<rect x="300" y="272" width="390" height="10" rx="3"/>

<rect x="300" y="304" width="320" height="10" rx="3"/>

<rect x="300" y="336" width="350" height="10" rx="3"/>

</g>

<!-- BAR BACKGROUND -->

<g fill="#21262d">

<rect x="720" y="240" width="170" height="10" rx="3"/>

<rect x="690" y="272" width="200" height="10" rx="3"/>

<rect x="620" y="304" width="270" height="10" rx="3"/>

<rect x="650" y="336" width="240" height="10" rx="3"/>

</g>

<!-- STATUS -->

<circle cx="430"
cy="385"
r="5"
fill="#58a6ff"
filter="url(#glow)">

<animate
attributeName="r"
values="5;10;5"
dur="1.5s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="1;0.25;1"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<text x="450"
y="390"
fill="#8b949e"
font-family="monospace"
font-size="11">

PROFILE STATUS : ONLINE

</text>

<!-- SCANNER -->

<rect x="70"
y="100"
width="860"
height="2"
fill="url(#scan)"
opacity="0.8">

<animate
attributeName="y"
values="100;350;100"
dur="5s"
repeatCount="indefinite"/>

</rect>

</svg>
