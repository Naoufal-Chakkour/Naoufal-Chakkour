<path d="M300 0V560"/>
<path d="M400 0V560"/>
<path d="M500 0V560"/>
<path d="M600 0V560"/>
<path d="M700 0V560"/>
<path d="M800 0V560"/>
<path d="M900 0V560"/>

</g>

