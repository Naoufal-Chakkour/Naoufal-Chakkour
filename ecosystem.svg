<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 726" width="1240" height="726" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .bg      { fill:#0a0d13; }
    .grid    { stroke:#141a24; stroke-width:0.5; opacity:0.55; }
    .title   { fill:#e6edf3; font-size:26px; font-weight:700; letter-spacing:7px; }
    .sub     { fill:#7d8590; font-size:9.5px; letter-spacing:2.4px; }
    .card    { fill:#0e1420; stroke:#1e2836; stroke-width:1.2; }
    .letter  { font-size:22px; font-weight:700; opacity:0.28; }
    .dom     { fill:#e6edf3; font-size:11px; font-weight:700; letter-spacing:0.8px; }
    .spec    { fill:#8b949e; font-size:8px; }
    .deep    { fill:#6e7681; font-size:7.4px; }
    .foot    { fill:#484f58; font-size:8px; letter-spacing:1.4px; }

    @keyframes spot {
       0%   { opacity:0.30; }
       1%   { opacity:1;    }
      11%   { opacity:1;    }
      13%   { opacity:0.30; }
     100%   { opacity:0.30; }
    }

    @keyframes lift {
       0%   { stroke-opacity:0.25; }
       1%   { stroke-opacity:1;    }
      11%   { stroke-opacity:1;    }
      13%   { stroke-opacity:0.25; }
     100%   { stroke-opacity:0.25; }
    }

    @keyframes glow {
       0%   { opacity:0; }
       1%   { opacity:0.30; }
      11%   { opacity:0.30; }
      13%   { opacity:0; }
     100%   { opacity:0; }
    }

    .reveal { animation: spot 24s linear infinite; }
    .edge   { animation: lift 24s linear infinite; }
    .halo   { animation: glow 24s linear infinite; }

    .n0 { animation-delay:0s;  }
    .n1 { animation-delay:3s;  }
    .n2 { animation-delay:6s;  }
    .n3 { animation-delay:9s;  }
    .n4 { animation-delay:12s; }
    .n5 { animation-delay:15s; }
    .n6 { animation-delay:18s; }
    .n7 { animation-delay:21s; }

    @media (prefers-color-scheme: light) {
      .bg    { fill:#f6f8fa; }
      .grid  { stroke:#d8dee4; }
      .card  { fill:#ffffff; stroke:#d0d7de; }
      .title { fill:#1f2328; }
      .dom   { fill:#1f2328; }
      .spec  { fill:#57606a; }
      .deep  { fill:#6e7781; }
      .sub   { fill:#57606a; }
      .foot  { fill:#8c959f; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation:none; opacity:1; }
      .edge   { animation:none; stroke-opacity:1; }
      .halo   { animation:none; opacity:0.12; }
    }
  </style>

  <rect width="1240" height="726" class="bg"/>

  <g class="grid" fill="none">
    <path d="M0 120h1240M0 250h1240M0 380h1240M0 510h1240M0 640h1240"/>
    <path d="M155 0v726M465 0v726M775 0v726M1085 0v726"/>
  </g>

  <text x="30" y="48" class="title">THE ECOSYSTEM</text>
  <text x="30" y="70" class="sub">EIGHT SECURITY &amp; DEVELOPMENT DOMAINS &#183; ONE LEARNING STACK &#183; ROSTER OPEN</text>
  <text x="30" y="92" class="deep">A practical ecosystem built around Linux, networks, security labs, software development and connected devices.</text>


  <!-- ============ A ============ -->

  <g>
    <rect x="30" y="118" width="280" height="238" rx="9" class="card"/>
    <rect x="30" y="118" width="280" height="238" rx="9" fill="#f59e0b" class="halo n0"/>
    <rect x="30" y="118" width="280" height="238" rx="9" fill="none" stroke="#f59e0b" stroke-width="1.6" class="edge n0"/>

    <g class="reveal n0">

      <text x="278" y="150" class="letter" fill="#f59e0b" text-anchor="end">A</text>

      <text x="48" y="146" class="dom">CYBERSECURITY</text>

      <text x="48" y="168" class="spec">reconnaissance &#183; vulnerability assessment</text>
      <text x="48" y="182" class="spec">web security &#183; authentication &#183; threat analysis</text>
      <text x="48" y="196" class="spec">ethical testing in controlled environments</text>

      <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.7">
        <path d="M48 232 L60 220 L72 232 L84 220 L96 232 L108 220 L120 232"/>
      </g>

      <text x="48" y="268" class="deep">Security is treated as a process of observation,</text>
      <text x="48" y="281" class="deep">verification and controlled experimentation.</text>
      <text x="48" y="294" class="deep">Find the exposed surface before assuming</text>
      <text x="48" y="307" class="deep">what a system is supposed to expose.</text>

      <text x="48" y="326" class="deep">Labs first. Real systems only with authorization.</text>

      <text x="48" y="344" class="foot">ETHICAL TESTING &#183; EVIDENCE FIRST</text>

    </g>
  </g>


  <!-- ============ B ============ -->

  <g>
    <rect x="330" y="118" width="280" height="238" rx="9" class="card"/>
    <rect x="330" y="118" width="280" height="238" rx="9" fill="#34d399" class="halo n1"/>
    <rect x="330" y="118" width="280" height="238" rx="9" fill="none" stroke="#34d399" stroke-width="1.6" class="edge n1"/>

    <g class="reveal n1">

      <text x="578" y="150" class="letter" fill="#34d399" text-anchor="end">B</text>

      <text x="348" y="146" class="dom">LINUX &amp; KALI</text>

      <text x="348" y="168" class="spec">Kali Linux &#183; shell &#183; packages &#183; permissions</text>
      <text x="348" y="182" class="spec">Nmap &#183; Wireshark &#183; GVM/OpenVAS &#183; curl</text>
      <text x="348" y="196" class="spec">VirtualBox &#183; isolated security laboratories</text>

      <g fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.75">
        <rect x="348" y="218" width="58" height="32" rx="3"/>
        <path d="M357 229 l7 6 l-7 6 M369 241 h18"/>
      </g>

      <text x="348" y="268" class="deep">The terminal is the primary instrument:</text>
      <text x="348" y="281" class="deep">inspect, enumerate, capture, verify and document.</text>
      <text x="348" y="294" class="deep">Tools are understood through their output,</text>
      <text x="348" y="307" class="deep">not simply by memorising commands.</text>

      <text x="348" y="326" class="deep">Controlled labs keep experiments reproducible.</text>

      <text x="348" y="344" class="foot">LINUX &#183; SECURITY TOOLING &#183; LABS</text>

    </g>
  </g>


  <!-- ============ C ============ -->

  <g>
    <rect x="630" y="118" width="280" height="238" rx="9" class="card"/>
    <rect x="630" y="118" width="280" height="238" rx="9" fill="#7dd3fc" class="halo n2"/>
    <rect x="630" y="118" width="280" height="238" rx="9" fill="none" stroke="#7dd3fc" stroke-width="1.6" class="edge n2"/>

    <g class="reveal n2">

      <text x="878" y="150" class="letter" fill="#7dd3fc" text-anchor="end">C</text>

      <text x="648" y="146" class="dom">NETWORKING &amp; TRAFFIC</text>

      <text x="648" y="168" class="spec">TCP/IP &#183; DNS &#183; HTTP &#183; TLS &#183; routing</text>
      <text x="648" y="182" class="spec">Nmap &#183; Wireshark &#183; packet analysis &#183; services</text>
      <text x="648" y="196" class="spec">local networks &#183; ports &#183; protocols &#183; discovery</text>

      <g stroke="#7dd3fc" stroke-width="1.2" fill="none" opacity="0.75">
        <circle cx="660" cy="232" r="6"/>
        <circle cx="700" cy="216" r="6"/>
        <circle cx="730" cy="244" r="6"/>
        <path d="M666 230 L694 218 M704 220 L726 240 M666 234 L724 244"/>
      </g>

      <text x="648" y="268" class="deep">A port is only the beginning of the question.</text>
      <text x="648" y="281" class="deep">Identify the service, understand the protocol,</text>
      <text x="648" y="294" class="deep">observe its behaviour and verify the assumption.</text>

      <text x="648" y="313" class="deep">Packets are evidence; scans are hypotheses.</text>
      <text x="648" y="326" class="deep">The distinction matters during every investigation.</text>

      <text x="648" y="344" class="foot">NETWORK VISIBILITY &#183; PACKET ANALYSIS</text>

    </g>
  </g>


  <!-- ============ D ============ -->

  <g>
    <rect x="930" y="118" width="280" height="238" rx="9" class="card"/>
    <rect x="930" y="118" width="280" height="238" rx="9" fill="#38bdf8" class="halo n3"/>
    <rect x="930" y="118" width="280" height="238" rx="9" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6 4" class="edge n3"/>

    <g class="reveal n3">

      <text x="1178" y="150" class="letter" fill="#38bdf8" text-anchor="end">D</text>

      <text x="948" y="146" class="dom">WEB &amp; APPLICATION SECURITY</text>

      <text x="948" y="168" class="spec">HTTP &#183; headers &#183; sessions &#183; authentication</text>
      <text x="948" y="182" class="spec">curl &#183; APIs &#183; forms &#183; proxies &#183; server behaviour</text>
      <text x="948" y="196" class="spec">secure coding &#183; controlled testing</text>

      <g stroke="#38bdf8" stroke-width="1.1" fill="none" opacity="0.7">
        <rect x="948" y="216" width="48" height="32" rx="3"/>
        <path d="M948 225 H996 M956 220 h8 M970 220 h8"/>
        <path d="M1008 232 H1030 M1024 226 l6 6 l-6 6"/>
      </g>

      <text x="948" y="268" class="deep">Requests are inspected before conclusions are made.</text>
      <text x="948" y="281" class="deep">Status codes, headers and authentication flows</text>
      <text x="948" y="294" class="deep">often reveal more than the visible interface.</text>

      <text x="948" y="313" class="deep">Build the vulnerable lab before testing the real one.</text>

      <text x="948" y="344" class="foot">HTTP &#183; APIs &#183; AUTHENTICATION &#183; SECURE LABS</text>

    </g>
  </g>


  <!-- ============ E ============ -->

  <g>
    <rect x="30" y="380" width="280" height="238" rx="9" class="card"/>
    <rect x="30" y="380" width="280" height="238" rx="9" fill="#f472b6" class="halo n4"/>
    <rect x="30" y="380" width="280" height="238" rx="9" fill="none" stroke="#f472b6" stroke-width="1.6" class="edge n4"/>

    <g class="reveal n4">

      <text x="278" y="412" class="letter" fill="#f472b6" text-anchor="end">E</text>

      <text x="48" y="408" class="dom">IoT &amp; CONNECTED DEVICES</text>

      <text x="48" y="430" class="spec">ONVIF &#183; RTSP &#183; IP cameras &#183; device discovery</text>
      <text x="48" y="444" class="spec">HTTP Digest &#183; SOAP &#183; service enumeration</text>
      <text x="48" y="458" class="spec">IoT protocols &#183; exposed interfaces &#183; hardening</text>

      <g fill="none" stroke="#f472b6" stroke-width="1.1" opacity="0.7">
        <rect x="48" y="482" width="40" height="26" rx="2"/>
        <circle cx="68" cy="495" r="7"/>
        <path d="M88 495 H105 M98 489 l7 6 l-7 6"/>
      </g>

      <text x="48" y="532" class="deep">A connected device is an ecosystem of services,</text>
      <text x="48" y="545" class="deep">not merely an IP address on a network.</text>
      <text x="48" y="558" class="deep">Discovery, authentication and protected operations</text>
      <text x="48" y="571" class="deep">must be understood separately.</text>

      <text x="48" y="590" class="deep">Research stays inside owned or authorised devices.</text>

      <text x="48" y="606" class="foot">IoT &#183; ONVIF &#183; RTSP &#183; PROTOCOL RESEARCH</text>

    </g>
  </g>


  <!-- ============ F ============ -->

  <g>
    <rect x="330" y="380" width="280" height="238" rx="9" class="card"/>
    <rect x="330" y="380" width="280" height="238" rx="9" fill="#a78bfa" class="halo n5"/>
    <rect x="330" y="380" width="280" height="238" rx="9" fill="none" stroke="#a78bfa" stroke-width="1.6" class="edge n5"/>

    <g class="reveal n5">

      <text x="578" y="412" class="letter" fill="#a78bfa" text-anchor="end">F</text>

      <text x="348" y="408" class="dom">PYTHON &amp; AUTOMATION</text>

      <text x="348" y="430" class="spec">Python &#183; scripting &#183; HTTP &#183; hashing</text>
      <text x="348" y="444" class="spec">automation &#183; parsing &#183; small security utilities</text>
      <text x="348" y="458" class="spec">reproducible experiments &#183; evidence collection</text>

      <g stroke="#a78bfa" stroke-width="1.1" fill="none" opacity="0.7">
        <path d="M348 500 H370 V486 H390 V500 H416"/>
        <circle cx="362" cy="500" r="3"/>
        <circle cx="400" cy="500" r="3"/>
      </g>

      <text x="348" y="532" class="deep">Automation is used to remove repetitive work,</text>
      <text x="348" y="545" class="deep">not to hide what the system is actually doing.</text>
      <text x="348" y="558" class="deep">Small scripts turn repeated observations into</text>
      <text x="348" y="571" class="deep">repeatable experiments and useful tooling.</text>

      <text x="348" y="590" class="deep">Understand the command before automating it.</text>

      <text x="348" y="606" class="foot">PYTHON &#183; AUTOMATION &#183; REPRODUCIBILITY</text>

    </g>
  </g>


  <!-- ============ G ============ -->

  <g>
    <rect x="630" y="380" width="280" height="238" rx="9" class="card"/>
    <rect x="630" y="380" width="280" height="238" rx="9" fill="#5eead4" class="halo n6"/>
    <rect x="630" y="380" width="280" height="238" rx="9" fill="none" stroke="#5eead4" stroke-width="1.6" class="edge n6"/>

    <g class="reveal n6">

      <text x="878" y="412" class="letter" fill="#5eead4" text-anchor="end">G</text>

      <text x="648" y="408" class="dom">C# &amp; SOFTWARE DEVELOPMENT</text>

      <text x="648" y="430" class="spec">C# &#183; .NET &#183; object-oriented programming</text>
      <text x="648" y="444" class="spec">Visual Studio Code &#183; Git &#183; GitHub</text>
      <text x="648" y="458" class="spec">APIs &#183; debugging &#183; structured applications</text>

      <g fill="none" stroke="#5eead4" stroke-width="1.1" opacity="0.7">
        <path d="M668 496 L680 484 L692 496 L680 508 Z"/>
        <path d="M692 496 H720"/>
        <circle cx="728" cy="496" r="8"/>
      </g>

      <text x="648" y="532" class="deep">Security knowledge becomes more useful when</text>
      <text x="648" y="545" class="deep">the system being tested can also be understood</text>
      <text x="648" y="558" class="deep">from the developer's side of the boundary.</text>

      <text x="648" y="577" class="deep">Code, version control and debugging complete</text>
      <text x="648" y="590" class="deep">the path from experiment to software.</text>

      <text x="648" y="606" class="foot">C# &#183; .NET &#183; GIT &#183; GITHUB</text>

    </g>
  </g>


  <!-- ============ H ============ -->

  <g>
    <rect x="930" y="380" width="280" height="238" rx="9" class="card"/>
    <rect x="930" y="380" width="280" height="238" rx="9" fill="#e879f9" class="halo n7"/>
    <rect x="930" y="380" width="280" height="238" rx="9" fill="none" stroke="#e879f9" stroke-width="1.6" class="edge n7"/>

    <g class="reveal n7">

      <text x="1178" y="412" class="letter" fill="#e879f9" text-anchor="end">H</text>

      <text x="948" y="408" class="dom">SECURITY LABS &amp; EVIDENCE</text>

      <text x="948" y="430" class="spec">VirtualBox &#183; isolated networks &#183; test services</text>
      <text x="948" y="444" class="spec">hashing &#183; logs &#183; packet captures &#183; notes</text>
      <text x="948" y="458" class="spec">observe &#183; reproduce &#183; document &#183; verify</text>

      <g stroke="#e879f9" stroke-width="1.1" fill="none" opacity="0.7">
        <path d="M948 500 q8 -18 16 0 t16 0 t16 0 t16 0 t16 0"/>
        <path d="M1030 500 H1054"/>
      </g>

      <text x="948" y="532" class="deep">A result without evidence is only an assumption.</text>
      <text x="948" y="545" class="deep">Commands, responses, captures and configuration</text>
      <text x="948" y="558" class="deep">are preserved so the experiment can be repeated.</text>

      <text x="948" y="577" class="deep">The goal is not to collect tools.</text>
      <text x="948" y="590" class="deep">The goal is to understand systems.</text>

      <text x="948" y="606" class="foot">OBSERVE &#183; REPRODUCE &#183; DOCUMENT &#183; VERIFY</text>

    </g>
  </g>


  <text x="30" y="662" class="sub">/RECON &#8226; /NETWORK &#8226; /WEB &#8226; /IoT &#8226; /LINUX &#8226; /CODE &#8226; /LABS</text>

  <text x="30" y="684" class="deep">A growing technical stack connecting cybersecurity, software development and practical systems research.</text>

  <text x="30" y="706" class="foot">ETHICAL TESTING &#183; LINUX FIRST &#183; EVIDENCE DRIVEN &#183; BUILD &#183; TEST &#183; UNDERSTAND</text>

</svg>
