    </text>

    <text x="990" y="392">
      EVIDENCE
    </text>

  </g>

  <rect x="34" y="404"
        width="1172"
        height="2"
        fill="#123a29"/>

  <rect x="34" y="404"
        width="180"
        height="2"
        fill="#34d399">

    <animate attributeName="x"
             values="34;1026;34"
             dur="9s"
             repeatCount="indefinite"/>

  </rect>

  <text x="34" y="432"
        fill="#1c4433"
        font-size="8">
