<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04120c"/><stop offset="100%" stop-color="#030b07"/>
    </linearGradient>

    <linearGradient id="bscr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05160e"/><stop offset="100%" stop-color="#020a06"/>
    </linearGradient>

    <filter id="bgl">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bclip">
      <rect x="176" y="66" width="880" height="300"/>
    </clipPath>

    <clipPath id="blog">
      <rect x="420" y="76" width="626" height="200"/>
    </clipPath>
  </defs>

  <rect width="1240" height="470" rx="10"
        fill="url(#bbg)"
        stroke="#1c2430"
        stroke-width="1.5"/>

  <text x="34" y="40"
        fill="#34d399"
        font-size="12.5"
        font-weight="700"
        letter-spacing="2.5">
    IoT &amp; CCTV SECURITY ANALYSER
  </text>

  <text x="34" y="58"
        fill="#245c43"
        font-size="8.5"
        letter-spacing="1.6">
