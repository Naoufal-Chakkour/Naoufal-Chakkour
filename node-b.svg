        <text x="530" y="178" fill="#4b7f66">realm + nonce</text>
        <text x="660" y="178" fill="#245c43">authentication observed</text>
        <text x="860" y="178" fill="#4b7f66">HTTP</text>

        <text x="424" y="200" fill="#34d399">&#8594;</text>
        <text x="442" y="200" fill="#86efac">RTSP</text>
        <text x="530" y="200" fill="#4b7f66">554</text>
        <text x="660" y="200" fill="#245c43">stream endpoint</text>
        <text x="860" y="200" fill="#f59e0b">AUTH</text>

        <text x="424" y="222" fill="#7dd3fc">&#8592;</text>
        <text x="442" y="222" fill="#86efac">CAPTURE</text>
        <text x="530" y="222" fill="#4b7f66">PCAP</text>
        <text x="660" y="222" fill="#245c43">traffic recorded</text>
        <text x="860" y="222" fill="#34d399">OK</text>

        <text x="424" y="244" fill="#34d399">&#8594;</text>
        <text x="442" y="244" fill="#86efac">ANALYSIS</text>
        <text x="530" y="244" fill="#4b7f66">Wireshark</text>
        <text x="660" y="244" fill="#245c43">protocol inspection</text>
        <text x="860" y="244" fill="#34d399">PASS</text>

        <text x="424" y="266" fill="#7dd3fc">&#8592;</text>
        <text x="442" y="266" fill="#86efac">VALIDATION</text>
        <text x="530" y="266" fill="#4b7f66">GVM</text>
        <text x="660" y="266" fill="#245c43">vulnerability assessment</text>
        <text x="860" y="266" fill="#34d399">LAB</text>

      </g>
    </g>

    <rect x="410" y="276"
          width="646"
          height="1"
          fill="#123a29"/>

    <text x="424" y="296"
          fill="#245c43"
          font-size="7.5">
