        <text x="530" y="112" fill="#4b7f66">ONVIF</text>
        <text x="660" y="112" fill="#245c43">device service</text>
        <text x="860" y="112" fill="#4b7f66">200 OK</text>

        <text x="424" y="134" fill="#7dd3fc">&#8592;</text>
