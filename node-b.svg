        stroke="#123a29"/>

  <g font-size="7.5" fill="#245c43">
    <text x="46" y="86">TARGET</text>
    <text x="46" y="128">PROTOCOL</text>
    <text x="46" y="170">SERVICE</text>
    <text x="46" y="212">AUTH</text>
    <text x="46" y="254">CAPTURE</text>
    <text x="46" y="296">ANALYSIS</text>
    <text x="46" y="338">EXPLOITATION</text>
  </g>

  <g font-size="10.5" fill="#86efac">
