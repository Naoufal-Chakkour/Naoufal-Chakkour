<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1240 470"
     width="1240"
     height="470"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07120f"/>
      <stop offset="100%" stop-color="#020806"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03130e"/>
      <stop offset="100%" stop-color="#020906"/>
    </linearGradient>

    <!-- ECG glow -->
    <filter id="ecgGlow"
            x="-20%"
            y="-50%"
            width="140%"
            height="200%">
      <feGaussianBlur stdDeviation="2.2"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft screen glow -->
    <radialGradient id="screenGlow">
      <stop offset="0%"
            stop-color="#34d399"
            stop-opacity="0.12"/>
      <stop offset="100%"
            stop-color="#34d399"
            stop-opacity="0"/>
    </radialGradient>

    <clipPath id="monitorClip">
      <rect x="176"
            y="66"
            width="880"
            height="300"
            rx="4"/>
    </clipPath>

  </defs>


