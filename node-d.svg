<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04101a"/><stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="dscr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05131f"/><stop offset="100%" stop-color="#020911"/>
    </linearGradient>
    <filter id="dgl">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dclip"><rect x="176" y="66" width="880" height="300"/></clipPath>
  </defs>

  <rect width="1240" height="470" rx="10" fill="url(#dbg)" stroke="#1c2430" stroke-width="1.5"/>

  <text x="34" y="40" fill="#38bdf8" font-size="12.5" font-weight="700" letter-spacing="2.5">
    SECURITY LEARNING PLANE · OPTIONAL
  </text>

  <text x="34" y="58" fill="#1e4a66" font-size="8.5" letter-spacing="1.6">
    NODE D · LINUX · GITHUB · C# / .NET · SECURITY RESEARCH
  </text>

  <circle cx="1150" cy="34" r="5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <text x="1163" y="38" fill="#38bdf8" font-size="9" letter-spacing="1.2">
    LAB
  </text>

  <!-- left -->
  <rect x="34" y="66" width="128" height="300" rx="5" fill="#051220" stroke="#123a52" stroke-dasharray="5 4"/>

  <g font-size="7.5" fill="#1e4a66">
    <text x="46" y="86">PLATFORM</text>
    <text x="46" y="128">SECURITY</text>
    <text x="46" y="170">LANGUAGE</text>
    <text x="46" y="212">VERSIONING</text>
    <text x="46" y="254">LAB</text>
    <text x="46" y="296">FOCUS</text>
    <text x="46" y="338">APPROACH</text>
  </g>

  <g font-size="10.5" fill="#7dd3fc">
    <text x="46" y="102">Linux</text>
    <text x="46" y="144">Cybersecurity</text>
    <text x="46" y="186">C# / .NET</text>
    <text x="46" y="228">Git / GitHub</text>
    <text x="46" y="270">Kali Linux</text>
    <text x="46" y="312">Networking</text>
  </g>

  <text x="46" y="354" font-size="10.5" fill="#34d399" font-weight="700">
    HANDS-ON
  </text>

  <!-- screen -->
  <rect x="176" y="66" width="880" height="300" rx="4" fill="url(#dscr)" stroke="#123a52"/>

  <g clip-path="url(#dclip)">

    <text x="192" y="88" fill="#1e4a66" font-size="7.5">
      PERSONAL SECURITY LAB · TOOLS &amp; PROJECT AREAS
    </text>

    <!-- nodes -->
    <g font-size="8.5">

      <text x="192" y="116" fill="#1e4a66">AREA</text>
      <text x="350" y="116" fill="#1e4a66">TOOLS / TECHNOLOGY</text>
      <text x="650" y="116" fill="#1e4a66">STATUS</text>

      <line x1="192" y1="124" x2="740" y2="124" stroke="#123a52"/>

      <text x="192" y="144" fill="#7dd3fc">NETWORK</text>
      <text x="350" y="144" fill="#5b9fc4">Nmap · Wireshark</text>
      <text x="650" y="144" fill="#34d399">learning</text>

      <text x="192" y="164" fill="#7dd3fc">VULNERABILITY</text>
      <text x="350" y="164" fill="#5b9fc4">GVM / OpenVAS</text>
      <text x="650" y="164" fill="#34d399">hands-on</text>

      <text x="192" y="184" fill="#7dd3fc">IoT / CCTV</text>
      <text x="350" y="184" fill="#5b9fc4">ONVIF · RTSP · HTTP</text>
      <text x="650" y="184" fill="#34d399">research</text>

      <text x="192" y="204" fill="#7dd3fc">RECON</text>
      <text x="350" y="204" fill="#5b9fc4">Shodan · service enumeration</text>
      <text x="650" y="204" fill="#34d399">practice</text>

      <text x="192" y="224" fill="#7dd3fc">PROGRAMMING</text>
      <text x="350" y="224" fill="#5b9fc4">C# · .NET · VS Code</text>
      <text x="650" y="224" fill="#34d399">learning</text>

      <text x="192" y="244" fill="#7dd3fc">VERSION CONTROL</text>
      <text x="350" y="244" fill="#5b9fc4">Git · GitHub</text>
      <text x="650" y="244" fill="#34d399">active</text>

    </g>

    <text x="192" y="274" fill="#34d399" font-size="8.5">
      security knowledge is built by testing, observing, documenting and repeating
    </text>

    <text x="192" y="294" fill="#1e4a66" font-size="7.5">
      each experiment is separated from production systems and evaluated from evidence
    </text>

    <!-- activity graph -->
    <line x1="192" y1="312" x2="740" y2="312" stroke="#123a52"/>

    <text x="192" y="330" fill="#1e4a66" font-size="7.5">
      LEARNING ACTIVITY
    </text>

    <polyline fill="none" stroke="#38bdf8" stroke-width="1.3" filter="url(#dgl)"
      points="300,344 340,340 380,346 420,338 460,344 500,334 540,340 580,328 620,336 660,324 700,330 740,318">

      <animate attributeName="points" dur="3.8s" repeatCount="indefinite"
        values="
        300,344 340,340 380,346 420,338 460,344 500,334 540,340 580,328 620,336 660,324 700,330 740,318;
        300,340 340,346 380,338 420,344 460,338 500,342 540,334 580,340 620,328 660,336 700,322 740,330;
        300,344 340,340 380,346 420,338 460,344 500,334 540,340 580,328 620,336 660,324 700,330 740,318"/>
    </polyline>

    <text x="748" y="326" fill="#7dd3fc" font-size="7.5">
      continuous
    </text>

    <!-- right argument -->
    <line x1="790" y1="76" x2="790" y2="356" stroke="#123a52"/>

    <text x="806" y="90" fill="#1e4a66" font-size="7.5">
      WHAT DEFINES THE LAB
    </text>

    <g font-size="8.5" fill="#7dd3fc">
      <text x="806" y="116">
        Learn by building small, controlled
      </text>
      <text x="806" y="132">
        experiments instead of relying only
      </text>
      <text x="806" y="148">
        on theory.
      </text>
    </g>

    <g font-size="8.5" fill="#5b9fc4">
      <text x="806" y="178">· understand the protocol</text>
      <text x="806" y="194">· observe the traffic</text>
      <text x="806" y="210">· identify the boundary</text>
      <text x="806" y="226">· document the result</text>
      <text x="806" y="242">· reproduce safely</text>
    </g>

    <g font-size="8.5" fill="#7dd3fc">
      <text x="806" y="274">
        The objective is not simply to
      </text>
      <text x="806" y="290">
        run security tools.
      </text>
    </g>

    <text x="806" y="320" fill="#34d399" font-size="8.5">
      Understand what they reveal.
    </text>

    <text x="806" y="338" fill="#34d399" font-size="8.5">
      Then verify it independently.
    </text>

  </g>

  <!-- right -->
  <rect x="1072" y="66" width="134" height="300" rx="5" fill="#051220" stroke="#123a52" stroke-dasharray="5 4"/>

  <g font-size="7.5" fill="#1e4a66">
    <text x="1084" y="86">STACK</text>
    <text x="1084" y="164">WORKFLOW</text>
    <text x="1084" y="272">PRINCIPLE</text>
  </g>

  <g font-size="9" fill="#7dd3fc">
    <text x="1084" y="104">Kali Linux</text>
    <text x="1084" y="118">Nmap</text>
    <text x="1084" y="132">Wireshark</text>
    <text x="1084" y="146">GVM</text>

    <text x="1084" y="182">scan</text>
    <text x="1084" y="196">capture</text>
    <text x="1084" y="210">analyze</text>
    <text x="1084" y="224">document</text>
    <text x="1084" y="238">verify</text>
  </g>

  <text x="1084" y="252" font-size="9" fill="#5b9fc4">
    repeat
  </text>

  <g font-size="9" fill="#34d399">
    <text x="1084" y="290">authorized</text>
    <text x="1084" y="304">controlled</text>
    <text x="1084" y="318">evidence</text>
    <text x="1084" y="332">learning</text>
  </g>

  <text x="1084" y="352" font-size="9" fill="#5b9fc4">
    documented
  </text>

  <!-- status -->
  <g font-size="8.5" fill="#1e4a66">
    <text x="34" y="392">LINUX</text>
    <text x="150" y="392">CYBERSECURITY</text>
    <text x="340" y="392">NETWORKING</text>
    <text x="500" y="392">C# / .NET</text>
    <text x="650" y="392">GIT / GITHUB</text>
    <text x="810" y="392">IoT / CCTV</text>
    <text x="980" y="392">HANDS-ON</text>
  </g>

  <rect x="34" y="404" width="1172" height="2" fill="#123a52"/>

  <rect x="34" y="404" width="180" height="2" fill="#38bdf8">
    <animate attributeName="x" values="34;1026;34" dur="9s" repeatCount="indefinite"/>
  </rect>

  <text x="34" y="432" fill="#173c52" font-size="8">
    cybersecurity is a continuous learning process built around controlled experiments and observable evidence
  </text>

  <text x="34" y="448" fill="#173c52" font-size="8">
    understand the system first · test responsibly · document precisely · improve continuously
  </text>
</svg>
