    <text x="1084" y="118">ONVIF detected</text>
    <text x="1084" y="132">RTSP present</text>
    <text x="1084" y="146">web interface</text>

    <text x="1084" y="194">HTTP 401</text>
    <text x="1084" y="208">Digest auth</text>
    <text x="1084" y="222">SOAP / XML</text>
    <text x="1084" y="236">Wireshark</text>

