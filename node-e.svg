    </text>

    <text x="472" y="178" fill="#f87171" font-size="7.5">
      PROTECTED ENDPOINT · 401 UNAUTHORIZED
    </text>

    <!-- PROTOCOL ANALYSIS -->
    <line x1="472" y1="194" x2="1040" y2="194" stroke="#4a1533"/>

    <text x="472" y="214" fill="#6b2447" font-size="7.5">
