  </text>

  <!-- STATUS -->
  <g font-size="8.5" fill="#6b2447">
    <text x="34" y="392">KALI LINUX · NMAP</text>
    <text x="220" y="392">WIRESHARK · CURL</text>
    <text x="430" y="392">ONVIF · RTSP</text>
    <text x="620" y="392">IP CAMERA · IoT</text>
    <text x="820" y="392">LOCAL LAB NETWORK</text>
  </g>

  <rect x="34" y="404" width="1172" height="2" fill="#4a1533"/>

  <rect x="34" y="404" width="180" height="2" fill="#f472b6">
    <animate attributeName="x"
             values="34;1026;34"
             dur="9s"
             repeatCount="indefinite"/>
  </rect>

  <text x="34" y="432" fill="#3f1329" font-size="8">
    discovery, service enumeration and protocol analysis are separated from authentication testing
  </text>

  <text x="34" y="448" fill="#3f1329" font-size="8">
    a visible service is not automatically an accessible service · evidence comes before assumptions
  </text>

