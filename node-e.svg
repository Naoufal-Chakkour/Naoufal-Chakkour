<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="ebg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15060f"/><stop offset="100%" stop-color="#0b0409"/>
    </linearGradient>
    <linearGradient id="escr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#180712"/><stop offset="100%" stop-color="#0a040a"/>
    </linearGradient>
    <filter id="egl2"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="eclip"><rect x="176" y="66" width="880" height="300"/></clipPath>
    <clipPath id="epreview"><rect x="192" y="100" width="240" height="150"/></clipPath>
  </defs>

  <rect width="1240" height="470" rx="10" fill="url(#ebg2)" stroke="#1c2430" stroke-width="1.5"/>

  <text x="34" y="40" fill="#f472b6" font-size="12.5" font-weight="700" letter-spacing="2.5">
    CAMERA &amp; NETWORK ANALYSER
  </text>
  <text x="34" y="58" fill="#6b2447" font-size="8.5" letter-spacing="1.6">
    NODE E · IP CAMERA &amp; IoT · ANALYSIS &amp; EVIDENCE
  </text>

  <circle cx="1150" cy="34" r="5" fill="#f472b6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.25s" repeatCount="indefinite"/>
  </circle>
  <text x="1163" y="38" fill="#f472b6" font-size="9" letter-spacing="1.2">SCAN</text>

  <!-- LEFT PARAMETERS -->
  <rect x="34" y="66" width="128" height="300" rx="5" fill="#130610" stroke="#4a1533"/>

  <g font-size="7.5" fill="#6b2447">
    <text x="46" y="86">DEVICE</text>
    <text x="46" y="128">PROTOCOL</text>
    <text x="46" y="170">DISCOVERY</text>
    <text x="46" y="212">STREAM</text>
    <text x="46" y="254">AUTH</text>
    <text x="46" y="296">ANALYSIS</text>
    <text x="46" y="338">CAPTURE</text>
  </g>

  <g font-size="10.5" fill="#f9a8d4">
    <text x="46" y="102">IP CAMERA</text>
    <text x="46" y="144">ONVIF / RTSP</text>
    <text x="46" y="186">WS-Discovery</text>
    <text x="46" y="228">RTSP</text>
    <text x="46" y="270">HTTP Digest</text>
    <text x="46" y="312">Wireshark</text>
  </g>

  <text x="46" y="354" font-size="10.5" fill="#f472b6" font-weight="700">
