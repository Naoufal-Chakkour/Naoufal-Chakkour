      <rect x="472" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="486" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="500" y="104" width="10" height="26" rx="1"
            fill="#7dd3fc" opacity="0.8"/>
      <rect x="514" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="528" y="104" width="10" height="26" rx="1"
            fill="#fbbf24" opacity="0.9"/>
      <rect x="542" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="556" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="570" y="104" width="10" height="26" rx="1"
            fill="#7dd3fc" opacity="0.8"/>
      <rect x="584" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="598" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="612" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="626" y="104" width="10" height="26" rx="1"
            fill="#fbbf24" opacity="0.9"/>
      <rect x="640" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="654" y="104" width="10" height="26" rx="1"
            fill="#7dd3fc" opacity="0.8"/>
      <rect x="668" y="104" width="10" height="26" rx="1"
            fill="#f472b6" opacity="0.8"/>
      <rect x="682" y="104" width="10" height="26" rx="1"
