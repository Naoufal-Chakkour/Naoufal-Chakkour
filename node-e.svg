  </text>

  <!-- MAIN SCREEN -->
  <rect x="176" y="66" width="880" height="300" rx="4" fill="url(#escr)" stroke="#4a1533"/>

  <g clip-path="url(#eclip)">

    <!-- CAMERA PREVIEW -->
    <rect x="192" y="100" width="240" height="150" rx="3" fill="#0d0309" stroke="#4a1533"/>

    <g clip-path="url(#epreview)">
      <g fill="none" stroke="#6b2447" stroke-width="1">
        <rect x="228" y="140" width="60" height="72"/>
        <rect x="312" y="164" width="46" height="48"/>
        <path d="M192 212 H432"/>
      </g>

      <rect x="222" y="134" width="72" height="84"
            fill="none" stroke="#f472b6" stroke-width="1.2"/>

      <text x="222" y="130" fill="#f472b6" font-size="7">
