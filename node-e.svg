    </text>

    <g font-size="8.5">

      <text x="472" y="238" fill="#f9a8d4">ONVIF</text>
      <text x="560" y="238" fill="#7dd3fc">device_service</text>
      <text x="720" y="238" fill="#34d399">200 OK</text>

      <text x="472" y="258" fill="#f9a8d4">ONVIF</text>
      <text x="560" y="258" fill="#7dd3fc">media_service</text>
      <text x="720" y="258" fill="#fbbf24">401</text>

      <text x="472" y="278" fill="#f9a8d4">RTSP</text>
      <text x="560" y="278" fill="#7dd3fc">authentication</text>
      <text x="720" y="278" fill="#fbbf24">DIGEST</text>

      <text x="472" y="298" fill="#f9a8d4">HTTP</text>
      <text x="560" y="298" fill="#7dd3fc">WWW-Authenticate</text>
      <text x="720" y="298" fill="#fbbf24">PRESENT</text>

    </g>

    <text x="472" y="324" fill="#5eead4" font-size="8.5">
      discovery ≠ authenticated access
    </text>

    <text x="472" y="340" fill="#6b2447" font-size="7.5">
      observed behavior is recorded before drawing conclusions
    </text>

  </g>

  <!-- RIGHT READOUTS -->
  <rect x="1072" y="66" width="134" height="300" rx="5"
