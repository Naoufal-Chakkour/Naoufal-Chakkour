    <text x="46" y="86">PLATFORM</text>
    <text x="46" y="128">SCANNER</text>
    <text x="46" y="170">DISCOVERY</text>
    <text x="46" y="212">ANALYSIS</text>
    <text x="46" y="254">CAPTURE</text>
    <text x="46" y="296">TARGET</text>
    <text x="46" y="338">MODE</text>
  </g>

  <g font-size="10.5" fill="#c4b5fd">
    <text x="46" y="102">Kali Linux</text>
    <text x="46" y="144">GVM / OpenVAS</text>
    <text x="46" y="186">Nmap</text>
    <text x="46" y="228">CVEs / services</text>
    <text x="46" y="270">Wireshark</text>
    <text x="46" y="312">own lab</text>
  </g>

  <text x="46" y="354"
        font-size="10.5" fill="#34d399"
        font-weight="700">AUTHORIZED</text>

