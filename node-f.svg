<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="fbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a18"/>
      <stop offset="100%" stop-color="#07050f"/>
    </linearGradient>
    <linearGradient id="fscr2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100c1e"/>
      <stop offset="100%" stop-color="#070511"/>
    </linearGradient>
    <linearGradient id="ffill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="fgl2">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="fclip2">
      <rect x="176" y="66" width="880" height="300"/>
    </clipPath>
  </defs>

  <rect width="1240" height="470" rx="10"
