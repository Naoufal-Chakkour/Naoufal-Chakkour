        values="
        736,210 768,196 800,204 832,174 864,188 896,164 928,178 960,150 992,166 1024,158 1040,162;
        736,200 768,206 800,184 832,194 864,168 896,186 928,164 960,180 992,158 1024,174 1040,162;
        736,210 768,196 800,204 832,174 864,188 896,164 928,178 960,150 992,166 1024,158 1040,162"/>
    </polyline>

    <line x1="736" y1="132"
