        stroke="#2c2350"/>

  <g font-size="7.5" fill="#4c3a7a">
    <text x="1084" y="86">SECURITY</text>
    <text x="1084" y="176">TOOLS</text>
    <text x="1084" y="284">EVIDENCE</text>
  </g>

  <g font-size="9" fill="#c4b5fd">

    <text x="1084" y="104">GVM configured</text>
    <text x="1084" y="118">OpenVAS feed</text>
    <text x="1084" y="132">CVE analysis</text>
    <text x="1084" y="146">service review</text>
    <text x="1084" y="160">risk assessment</text>

    <text x="1084" y="194">Nmap</text>
    <text x="1084" y="208">Wireshark</text>
    <text x="1084" y="222">curl</text>
    <text x="1084" y="236">dig</text>
    <text x="1084" y="250">Kali Linux</text>

    <text x="1084" y="302">scan report</text>
    <text x="1084" y="316">service evidence</text>
    <text x="1084" y="330">packet evidence</text>

  </g>

  <text x="1084" y="266"
        font-size="9"
        fill="#34d399">lab focused</text>

  <text x="1084" y="350"
        font-size="9"
        fill="#34d399">documented</text>

  <!-- STATUS -->
  <g font-size="8.5" fill="#4c3a7a">

    <text x="34" y="392">
      KALI LINUX
    </text>

    <text x="170" y="392">
      NMAP &#183; WIRESHARK
    </text>

    <text x="360" y="392">
      GVM &#183; OPENVAS
    </text>

    <text x="560" y="392">
      CVE ANALYSIS
    </text>

    <text x="730" y="392">
      NETWORK RESEARCH
    </text>

    <text x="960" y="392">
      AUTHORIZED LAB
    </text>

  </g>

  <rect x="34" y="404"
        width="1172"
        height="2"
        fill="#2c2350"/>

  <rect x="34" y="404"
        width="180"
        height="2"
        fill="#a78bfa">

    <animate attributeName="x"
      values="34;1026;34"
      dur="9s"
      repeatCount="indefinite"/>
  </rect>

  <text x="34" y="432"
        fill="#372c5c"
        font-size="8">
    vulnerability scanning is used to understand exposure, not to assume that every scanner result is automatically exploitable
  </text>

  <text x="34" y="448"
        fill="#372c5c"
        font-size="8">
    discovery, packet analysis and vulnerability assessment remain separate steps &#183; evidence is collected before conclusions are drawn
  </text>

</svg>
