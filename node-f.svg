            stroke="#2c2350"/>

      <text x="192" y="140"
            fill="#c4b5fd">Nmap</text>
      <text x="310" y="140"
            fill="#8b7fc4">host / port discovery</text>
      <text x="520" y="140"
            fill="#c4b5fd">open ports + services</text>
      <text x="720" y="140"
            fill="#34d399">OK</text>

      <text x="192" y="164"
            fill="#c4b5fd">GVM</text>
      <text x="310" y="164"
            fill="#8b7fc4">vulnerability assessment</text>
      <text x="520" y="164"
            fill="#c4b5fd">findings + CVEs</text>
      <text x="720" y="164"
            fill="#34d399">READY</text>

      <text x="192" y="188"
            fill="#c4b5fd">OpenVAS</text>
      <text x="310" y="188"
            fill="#8b7fc4">NVT-based scanning</text>
      <text x="520" y="188"
            fill="#c4b5fd">severity / evidence</text>
      <text x="720" y="188"
            fill="#34d399">ACTIVE</text>

      <text x="192" y="212"
            fill="#c4b5fd">Wireshark</text>
      <text x="310" y="212"
            fill="#8b7fc4">traffic analysis</text>
      <text x="520" y="212"
            fill="#c4b5fd">packets / protocols</text>
      <text x="720" y="212"
            fill="#34d399">AVAILABLE</text>

      <text x="192" y="236"
            fill="#c4b5fd">curl</text>
      <text x="310" y="236"
            fill="#8b7fc4">HTTP / API testing</text>
      <text x="520" y="236"
            fill="#c4b5fd">headers / responses</text>
      <text x="720" y="236"
