      <text x="310" y="112" fill="#4c3a7a">ROLE</text>
      <text x="520" y="112" fill="#4c3a7a">RESULT</text>
      <text x="720" y="112" fill="#4c3a7a">STATUS</text>

      <line x1="192" y1="120"
