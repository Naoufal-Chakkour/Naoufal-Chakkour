    </text>

    <g font-size="8.5">
      <text x="736" y="310"
            fill="#c4b5fd">GVM feed: monitored</text>

      <text x="736" y="326"
            fill="#c4b5fd">NVT / CVE data: analyzed</text>

      <text x="736" y="342"
