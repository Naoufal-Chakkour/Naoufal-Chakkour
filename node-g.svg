<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04120f"/>
      <stop offset="100%" stop-color="#020a08"/>
    </linearGradient>
    <linearGradient id="gscr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04150f"/>
      <stop offset="100%" stop-color="#020b07"/>
    </linearGradient>
    <radialGradient id="gsweepgrad">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="ggl">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="gclip">
      <rect x="176" y="66" width="880" height="300"/>
    </clipPath>
  </defs>

  <rect width="1240" height="470" rx="10"
        fill="url(#gbg)" stroke="#1c2430" stroke-width="1.5"/>

  <text x="34" y="40"
        fill="#5eead4" font-size="12.5" font-weight="700"
        letter-spacing="2.5">LINUX &amp; SECURITY TOOLCHAIN</text>

  <text x="34" y="58"
        fill="#1f4f47" font-size="8.5"
        letter-spacing="1.6">NODE G &#183; BASH &#183; NETWORK ANALYSIS &#183; VULNERABILITY ASSESSMENT</text>

  <circle cx="1150" cy="34" r="5" fill="#5eead4">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="1.4s"
             repeatCount="indefinite"/>
  </circle>

  <text x="1163" y="38"
        fill="#5eead4" font-size="9"
        letter-spacing="1.2">SCAN</text>

  <!-- LEFT PANEL -->
  <rect x="34" y="66" width="128" height="300" rx="5"
        fill="#05130e" stroke="#12403a"/>

  <g font-size="7.5" fill="#1f4f47">
    <text x="46" y="86">OS</text>
    <text x="46" y="128">SHELL</text>
    <text x="46" y="170">SCANNING</text>
    <text x="46" y="212">ANALYSIS</text>
    <text x="46" y="254">VULN ASSESSMENT</text>
    <text x="46" y="296">WEB / DEVICE</text>
    <text x="46" y="338">LEVEL</text>
  </g>

  <g font-size="10.5" fill="#7de8d4">
    <text x="46" y="102">Linux / Kali</text>
    <text x="46" y="144">Bash</text>
    <text x="46" y="186">Nmap</text>
    <text x="46" y="228">Wireshark</text>
    <text x="46" y="270">GVM / OpenVAS</text>
    <text x="46" y="312">ONVIF / RTSP</text>
  </g>

  <text x="46" y="354"
        font-size="10.5" fill="#34d399"
        font-weight="700">LEARNING</text>


  <!-- MAIN PANEL -->
  <rect x="176" y="66" width="880" height="300" rx="4"
        fill="url(#gscr)" stroke="#12403a"/>

  <g clip-path="url(#gclip)">

    <!-- TERMINAL -->
    <rect x="192" y="86" width="390" height="120" rx="4"
          fill="#020907" stroke="#12403a"/>

    <text x="206" y="104"
          fill="#1f4f47" font-size="7.5">BASH TERMINAL &#183; LINUX WORKFLOW</text>

    <g font-size="8.5">
      <text x="206" y="124" fill="#5eead4">┌──(kali㉿lab)-[~]</text>
      <text x="206" y="140" fill="#7de8d4">└─$ ip addr</text>
      <text x="206" y="156" fill="#7de8d4">└─$ nmap -sV 192.168.100.0/24</text>
      <text x="206" y="172" fill="#7de8d4">└─$ curl -i http://target/</text>
      <text x="206" y="188" fill="#7de8d4">└─$ dig example.local</text>
    </g>

    <text x="206" y="202"
          fill="#1f4f47" font-size="7.5">
      commands used for controlled lab and network analysis
    </text>


    <!-- NETWORK DISCOVERY -->
    <line x1="600" y1="76" x2="600" y2="356"
          stroke="#12403a"/>

    <text x="618" y="90"
          fill="#1f4f47" font-size="7.5">
      NETWORK DISCOVERY &#183; OBSERVE BEFORE INTERACT
    </text>

    <g font-size="8.5">

      <text x="618" y="116" fill="#7de8d4">HOST</text>
      <rect x="680" y="108" width="280" height="9"
            rx="2" fill="#07201a" stroke="#12403a"/>
      <rect x="750" y="109" width="6" height="7"
            fill="#5eead4"/>
      <text x="972" y="116" fill="#4b8f83">discovered</text>

      <text x="618" y="142" fill="#7de8d4">PORT</text>
      <rect x="680" y="134" width="280" height="9"
            rx="2" fill="#07201a" stroke="#12403a"/>
      <rect x="820" y="135" width="48" height="7"
            fill="#5eead4"/>
      <text x="972" y="142" fill="#4b8f83">service</text>

      <text x="618" y="168" fill="#7de8d4">HTTP</text>
      <rect x="680" y="160" width="280" height="9"
            rx="2" fill="#07201a" stroke="#12403a"/>
      <rect x="790" y="161" width="34" height="7"
            fill="#7dd3fc"/>
      <text x="972" y="168" fill="#4b8f83">headers</text>

      <text x="618" y="194" fill="#7de8d4">ONVIF</text>
      <rect x="680" y="186" width="280" height="9"
            rx="2" fill="#07201a" stroke="#12403a"/>
      <rect x="840" y="187" width="28" height="7"
            fill="#fbbf24"/>
      <text x="972" y="194" fill="#fbbf24">protected</text>

    </g>

    <text x="618" y="220"
          fill="#fbbf24" font-size="7.5">
      discovery is separated from authenticated operations
    </text>


    <!-- SECURITY ANALYSIS -->
    <line x1="192" y1="222" x2="582" y2="222"
          stroke="#12403a"/>

    <text x="192" y="240"
          fill="#1f4f47" font-size="7.5">
      SECURITY ANALYSIS
    </text>

    <g font-size="8.5">
      <text x="192" y="258" fill="#7de8d4">
        Nmap
      </text>
      <text x="270" y="258" fill="#4b8f83">
        ports &#183; services &#183; versions
      </text>

      <text x="192" y="276" fill="#7de8d4">
        Wireshark
      </text>
      <text x="270" y="276" fill="#4b8f83">
        packets &#183; protocols &#183; traffic
      </text>

      <text x="192" y="294" fill="#7de8d4">
        curl / dig
      </text>
      <text x="270" y="294" fill="#4b8f83">
        HTTP &#183; DNS &#183; endpoint behaviour
      </text>

      <text x="192" y="312" fill="#7de8d4">
        GVM / OpenVAS
      </text>
      <text x="270" y="312" fill="#4b8f83">
        vulnerability assessment
      </text>

      <text x="192" y="330" fill="#7de8d4">
        Bash
      </text>
      <text x="270" y="330" fill="#4b8f83">
        automation &#183; files &#183; command-line workflow
      </text>

    </g>


    <!-- RIGHT ANALYSIS -->
    <text x="618" y="250"
          fill="#1f4f47" font-size="7.5">
      CURRENT FOCUS
    </text>

    <g font-size="8.5" fill="#7de8d4">
      <text x="618" y="270">
        Linux fundamentals and command-line fluency
      </text>

      <text x="618" y="288">
        network discovery and service enumeration
      </text>

      <text x="618" y="306">
        packet inspection and protocol understanding
      </text>

      <text x="618" y="324">
        vulnerability scanning with GVM / OpenVAS
      </text>

      <text x="618" y="342">
        IoT / CCTV / ONVIF security research in controlled environments
      </text>
    </g>

    <text x="618" y="358"
          fill="#34d399" font-size="8.5">
      understand first &#183; test safely &#183; document evidence
    </text>

  </g>


  <!-- RIGHT PANEL -->
  <rect x="1072" y="66" width="134" height="300" rx="5"
        fill="#05130e" stroke="#12403a"/>

  <g font-size="7.5" fill="#1f4f47">
    <text x="1084" y="86">PLATFORM</text>
    <text x="1084" y="176">TOOLS</text>
    <text x="1084" y="284">APPROACH</text>
  </g>

  <g font-size="9" fill="#7de8d4">

    <text x="1084" y="104">Kali Linux</text>
    <text x="1084" y="118">Linux CLI</text>
    <text x="1084" y="132">Bash</text>
    <text x="1084" y="146">Git / VS Code</text>

    <text x="1084" y="194">Nmap</text>
    <text x="1084" y="208">Wireshark</text>
    <text x="1084" y="222">GVM / OpenVAS</text>
    <text x="1084" y="236">curl</text>
    <text x="1084" y="250">dig</text>
    <text x="1084" y="264">ONVIF / RTSP</text>

    <text x="1084" y="302">enumerate</text>
    <text x="1084" y="316">inspect</text>
    <text x="1084" y="330">verify</text>
    <text x="1084" y="344">document</text>

  </g>

  <text x="1084" y="358"
        font-size="9" fill="#34d399">
    lab-first
  </text>


  <!-- FOOTER -->
  <g font-size="8.5" fill="#1f4f47">
    <text x="34" y="392">
      LINUX &#183; BASH
    </text>

    <text x="210" y="392">
      NMAP &#183; WIRESHARK
    </text>

    <text x="420" y="392">
      GVM / OPENVAS
    </text>

    <text x="610" y="392">
      CURL &#183; DIG
    </text>

    <text x="760" y="392">
      ONVIF &#183; RTSP
    </text>

    <text x="940" y="392">
      NETWORK SECURITY
    </text>
  </g>

  <rect x="34" y="404" width="1172" height="2"
        fill="#12403a"/>

  <rect x="34" y="404" width="180" height="2"
        fill="#5eead4">
    <animate attributeName="x"
             values="34;1026;34"
             dur="9s"
             repeatCount="indefinite"/>
  </rect>

  <text x="34" y="432"
        fill="#1a3b35" font-size="8">
    the workflow is built around observation, enumeration and verification
    &#183; not around assuming that a scan result is automatically correct
  </text>

  <text x="34" y="448"
        fill="#1a3b35" font-size="8">
    GVM / OpenVAS is used for vulnerability assessment
    &#183; Bash and Linux provide the foundation for the rest of the toolchain
  </text>

</svg>
