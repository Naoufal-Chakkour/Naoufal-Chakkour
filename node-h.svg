    <text x="206" y="288"
          fill="#5c2f66"
          font-size="7.5">
      SIMPLE BASH AUTOMATION
    </text>

    <g font-size="8.2" fill="#f0abfc">
      <text x="206" y="306">#!/bin/bash</text>
      <text x="206" y="322">TARGET="192.168.100.85"</text>
      <text x="206" y="338">nmap -sV "$TARGET" -oN scan.txt</text>
    </g>


