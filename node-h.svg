  </text>


  <!-- FOOTER -->
  <g font-size="8.5" fill="#5c2f66">

    <text x="34" y="392">
      LINUX &#183; BASH
    </text>

    <text x="190" y="392">
      NMAP &#183; WIRESHARK
    </text>

    <text x="390" y="392">
      GVM / OPENVAS
    </text>

    <text x="590" y="392">
      CURL &#183; DIG
    </text>

    <text x="740" y="392">
      ONVIF &#183; RTSP
    </text>

    <text x="930" y="392">
      NETWORK SECURITY
    </text>

  </g>

  <rect x="34" y="404" width="1172" height="2"
        fill="#3d1f45"/>

  <rect x="34" y="404" width="180" height="2"
        fill="#e879f9">

    <animate attributeName="x"
             values="34;1026;34"
             dur="9s"
             repeatCount="indefinite"/>

  </rect>

  <text x="34" y="432"
        fill="#3a2140"
        font-size="8">
    Linux provides the foundation &#183; Bash turns repeated tasks into reproducible workflows
  </text>

  <text x="34" y="448"
        fill="#3a2140"
        font-size="8">
    Nmap, Wireshark and GVM/OpenVAS are used to observe, assess and document systems in controlled environments
  </text>

</svg>
