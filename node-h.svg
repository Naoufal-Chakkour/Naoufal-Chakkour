<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="hbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a16"/>
      <stop offset="100%" stop-color="#09050c"/>
    </linearGradient>

    <linearGradient id="hscr2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150c1a"/>
      <stop offset="100%" stop-color="#09050d"/>
    </linearGradient>

    <filter id="hgl2">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="hclip2">
      <rect x="176" y="66" width="880" height="300"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1240" height="470" rx="10"
