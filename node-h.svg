  <g font-size="7.5" fill="#5c2f66">
    <text x="46" y="86">PLATFORM</text>
    <text x="46" y="128">SHELL</text>
    <text x="46" y="170">NETWORK</text>
    <text x="46" y="212">SECURITY</text>
    <text x="46" y="254">ASSESSMENT</text>
    <text x="46" y="296">DEVICE RESEARCH</text>
    <text x="46" y="338">APPROACH</text>
  </g>

  <g font-size="10.5" fill="#f0abfc">
    <text x="46" y="102">Kali Linux</text>
    <text x="46" y="144">Bash</text>
    <text x="46" y="186">TCP/IP</text>
    <text x="46" y="228">Nmap</text>
    <text x="46" y="270">GVM/OpenVAS</text>
    <text x="46" y="312">ONVIF / RTSP</text>
  </g>

  <text x="46" y="354"
        font-size="10.5"
        fill="#34d399"
        font-weight="700">LAB FOCUSED</text>


