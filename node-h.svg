    <rect x="192" y="82" width="408" height="178" rx="4"
          fill="#060308" stroke="#3d1f45"/>

    <text x="206" y="99"
          fill="#5c2f66"
          font-size="7.5">
      KALI LINUX &#183; BASH TERMINAL
    </text>

    <g font-size="8.2">

      <text x="206" y="119" fill="#e879f9">
        ┌──(kali㉿lab)-[~/security-lab]
      </text>

      <text x="206" y="137" fill="#f0abfc">
        └─$ ip addr
      </text>

      <text x="206" y="153" fill="#8f6f96">
        inet 192.168.100.x/24
      </text>

      <text x="206" y="169" fill="#f0abfc">
        └─$ ip route
      </text>

      <text x="206" y="185" fill="#f0abfc">
        └─$ nmap -sV 192.168.100.85
      </text>

      <text x="206" y="201" fill="#f0abfc">
        └─$ curl -i http://192.168.100.85/
      </text>

      <text x="206" y="217" fill="#f0abfc">
        └─$ dig example.local
      </text>

      <text x="206" y="233" fill="#f0abfc">
        └─$ ss -tulpen
      </text>

      <text x="206" y="249" fill="#34d399">
        commands executed in a controlled lab
      </text>

    </g>


