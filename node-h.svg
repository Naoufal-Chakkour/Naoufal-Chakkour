    </text>

    <!-- STEP 1 -->
    <g font-size="8.5">
      <text x="638" y="116"
            fill="#e879f9">01</text>

      <text x="672" y="116"
            fill="#f0abfc">
        Discover
      </text>

      <text x="748" y="116"
            fill="#8f6f96">
        ip &#183; arp &#183; nmap
      </text>
    </g>

    <!-- STEP 2 -->
    <g font-size="8.5">
      <text x="638" y="142"
            fill="#e879f9">02</text>

      <text x="672" y="142"
            fill="#f0abfc">
        Enumerate
      </text>

      <text x="748" y="142"
            fill="#8f6f96">
        ports &#183; services &#183; versions
      </text>
    </g>

    <!-- STEP 3 -->
    <g font-size="8.5">
      <text x="638" y="168"
            fill="#e879f9">03</text>

      <text x="672" y="168"
            fill="#f0abfc">
        Inspect
      </text>

      <text x="748" y="168"
            fill="#8f6f96">
        Wireshark &#183; curl &#183; dig
      </text>
    </g>

    <!-- STEP 4 -->
    <g font-size="8.5">
      <text x="638" y="194"
            fill="#e879f9">04</text>

      <text x="672" y="194"
            fill="#f0abfc">
        Assess
      </text>

      <text x="748" y="194"
            fill="#8f6f96">
        GVM / OpenVAS
      </text>
    </g>

    <!-- STEP 5 -->
    <g font-size="8.5">
      <text x="638" y="220"
            fill="#e879f9">05</text>

      <text x="672" y="220"
            fill="#f0abfc">
        Verify
      </text>

      <text x="748" y="220"
            fill="#8f6f96">
        compare evidence &#183; document
      </text>
    </g>


    <!-- SECURITY TOOLS -->
    <line x1="638" y1="238" x2="1038" y2="238"
          stroke="#3d1f45"/>

    <text x="638" y="256"
          fill="#5c2f66"
          font-size="7.5">
