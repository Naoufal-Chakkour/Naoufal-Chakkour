  <text x="34" y="58"
        fill="#5c2f66"
        font-size="8.5"
        letter-spacing="1.6">
    NODE H &#183; BASH &#183; LINUX &#183; NETWORKING &#183; SECURITY TOOLING
  </text>

  <circle cx="1150" cy="34" r="5" fill="#e879f9">
    <animate attributeName="opacity"
