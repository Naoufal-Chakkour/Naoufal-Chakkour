  <g font-size="7.5" fill="#5c2f66">
    <text x="1084" y="86">LINUX</text>
    <text x="1084" y="164">SECURITY</text>
    <text x="1084" y="270">PRACTICE</text>
  </g>

  <g font-size="9" fill="#f0abfc">

    <text x="1084" y="104">Kali Linux</text>
    <text x="1084" y="118">Bash CLI</text>
    <text x="1084" y="132">filesystem</text>
    <text x="1084" y="146">processes</text>

    <text x="1084" y="182">Nmap</text>
    <text x="1084" y="196">Wireshark</text>
    <text x="1084" y="210">GVM / OpenVAS</text>
    <text x="1084" y="224">curl / dig</text>
    <text x="1084" y="238">ONVIF / RTSP</text>

    <text x="1084" y="288">enumeration</text>
    <text x="1084" y="302">analysis</text>
    <text x="1084" y="316">verification</text>
    <text x="1084" y="330">documentation</text>

  </g>

  <text x="1084" y="350"
