    </text>

    <g font-size="8.5" fill="#f0abfc">
      <text x="638" y="274">
        Nmap
      </text>
      <text x="704" y="274"
            fill="#8f6f96">
        host discovery / ports / service detection
      </text>

      <text x="638" y="292">
        Wireshark
      </text>
      <text x="704" y="292"
            fill="#8f6f96">
        packet capture / protocol analysis
      </text>

      <text x="638" y="310">
        GVM / OpenVAS
      </text>
      <text x="704" y="310"
            fill="#8f6f96">
        vulnerability assessment
      </text>

      <text x="638" y="328">
        ONVIF / RTSP
      </text>
      <text x="704" y="328"
            fill="#8f6f96">
        controlled IoT / camera research
      </text>

      <text x="638" y="346">
        Bash
      </text>
      <text x="704" y="346"
            fill="#8f6f96">
        repeatable command-line workflows
      </text>
    </g>

  </g>


  <!-- RIGHT STATUS PANEL -->
  <rect x="1072" y="66" width="134" height="300" rx="5"
